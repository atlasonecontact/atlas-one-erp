<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión - ATLAS ONE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    h1 {
      color: #333;
      margin-bottom: 16px;
      font-size: 28px;
      font-weight: 700;
    }

    p {
      color: #666;
      margin-bottom: 24px;
      font-size: 16px;
      line-height: 1.6;
    }

    .features {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin: 24px 0;
      text-align: left;
    }

    .feature {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }

    .feature:last-child {
      margin-bottom: 0;
    }

    .feature-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      flex-shrink: 0;
    }

    .feature-text {
      color: #555;
      font-size: 14px;
    }

    .button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .button:active {
      transform: translateY(0);
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
    }

    .status.offline {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }

    .status.online {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      📡
    </div>
    
    <h1>Sin conexión a Internet</h1>
    
    <p>
      No te preocupes, ATLAS ONE funciona parcialmente sin conexión. 
      Los cambios se sincronizarán automáticamente cuando vuelvas a estar online.
    </p>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">✓</div>
        <div class="feature-text">Las ventas se guardan localmente</div>
      </div>
      <div class="feature">
        <div class="feature-icon">✓</div>
        <div class="feature-text">Acceso a productos cacheados</div>
      </div>
      <div class="feature">
        <div class="feature-icon">✓</div>
        <div class="feature-text">Sincronización automática al reconectar</div>
      </div>
    </div>

    <button class="button" onclick="tryReconnect()">
      Reintentar conexión
    </button>

    <div id="status" class="status offline">
      🔴 Sin conexión
    </div>
  </div>

  <script>
    function updateStatus() {
      const statusEl = document.getElementById('status');
      if (navigator.onLine) {
        statusEl.className = 'status online';
        statusEl.innerHTML = '🟢 Conectado - Redirigiendo...';
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 1000);
      } else {
        statusEl.className = 'status offline';
        statusEl.innerHTML = '🔴 Sin conexión';
      }
    }

    function tryReconnect() {
      updateStatus();
      if (navigator.onLine) {
        window.location.href = '/dashboard';
      }
    }

    // Escuchar cambios en el estado de la red
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);

    // Verificar cada 3 segundos
    setInterval(updateStatus, 3000);

    // Verificar estado inicial
    updateStatus();
  </script>
</body>
</html>
